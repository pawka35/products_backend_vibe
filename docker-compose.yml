services:
  # MariaDB база данных (совместима с MySQL, работает на старых CPU)
  # Используется вместо MySQL 8.0 из-за совместимости со старыми процессорами (x86-64-v2)
  mysql:
    image: mariadb:10.5
    container_name: fastapi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fastapi_auth
      MYSQL_USER: fastapi_user
      MYSQL_PASSWORD: fastapi_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=100
      - --skip-name-resolve
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # FastAPI приложение
  fastapi:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://fastapi_user:fastapi_password@mysql:3306/fastapi_auth
      - SECRET_KEY=your-secret-key-here-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response = urllib.request.urlopen('http://localhost:8000/health', timeout=5); exit(0) if response.getcode() == 200 else exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Nginx прокси-сервер
  nginx:
    build: ./nginx
    container_name: fastapi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./www:/var/www/html:ro  # Монтируем статический сайт
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot для получения и обновления SSL сертификатов
  # Примечание: Для первого получения сертификата используйте скрипт init-ssl.sh
  # Скрипт автоматически остановит этот сервис перед получением сертификата
  certbot:
    image: certbot/certbot:latest
    container_name: fastapi_certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet || true; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network

volumes:
  mysql_data:
  certbot_data:
  certbot_www:

networks:
  app_network:
    driver: bridge
