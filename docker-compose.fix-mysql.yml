version: '3.8'

services:
  # MySQL база данных (исправленная версия)
  mysql:
    image: mysql:8.0
    container_name: fastapi_mysql
    restart: unless-stopped  # Изменено с always на unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fastapi_auth
      MYSQL_USER: fastapi_user
      MYSQL_PASSWORD: fastapi_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M  # Уменьшен размер для старых серверов
      - --max-connections=100
      - --wait-timeout=28800
      - --interactive-timeout=28800
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fastapi_user", "-pfastapi_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s  # Увеличено время на старт
    # Добавлены лимиты ресурсов для старых серверов
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # FastAPI приложение
  fastapi:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://fastapi_user:fastapi_password@mysql:3306/fastapi_auth
      - SECRET_KEY=your-secret-key-here-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./logs:/app/logs

  # Nginx прокси-сервер
  nginx:
    build: ./nginx
    container_name: fastapi_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - fastapi
    networks:
      - app_network
    volumes:
      - ./nginx/logs:/var/log/nginx

volumes:
  mysql_data:
    driver: local

networks:
  app_network:
    driver: bridge

